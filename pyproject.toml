[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepflow"
version = "0.1.3"
description = "Physics-Informed Neural Networks for Fluid Dynamics"
authors = [{ name = "Thammatorn Jamraschai", email = "thammatorn.j@gmail.com" }]
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["PINNs", "neural-networks", "fluid-dynamics", "PDEs", "physics-informed", "deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics"
]
urls = {Homepage = "https://github.com/YoYo-XYZ/pinn-deepflow"}
dependencies = [
    "torch>=1.13.0",
    "numpy>=1.19.0",
    "matplotlib>=3.3.0",
    "sympy>=1.5.0",
    "ultraplot>=1.0.0",
    "scipy>=1.8.0",
    "cloudpickle>=2.0.0",
]

[project.optional-dependencies]
cfd = [
    "ngsolve>=6.2; python_version >= '3.10'",
]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: extended numerical and reproducibility checks",
]
