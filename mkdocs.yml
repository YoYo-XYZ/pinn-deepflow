site_name: DeepFlow   # Change to your project name
site_url: https://yoyo-xyz.github.io/pinn-deepflow/
repo_url: https://github.com/YoYo-XYZ/pinn-deepflow
repo_name: GitHub
edit_uri: edit/dev/docs/    # Lets people click "Edit on GitHub"

theme:
  name: material             # The beautiful theme
  features:
    - content.code.copy      # Copy button on code blocks
    - content.action.edit    # Edit this page on GitHub
    - navigation.tabs        # Top tabs if you want
    - navigation.sections
    - search.suggest
    - search.highlight
    
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            filters:
              - "!^_"
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:     # Math support: $$ equation $$
      generic: true
  - admonition               # Callouts: !!! note "Title"
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/install.md
    - Quick start: getting-started/quickstart.md
  - Guides:
    - Model persistence: guides/persistence.md
    - FAQ: guides/faq.md
  - Examples:
    - Overview: examples/index.md
    - Steady problems:
      - Burgers' equation: examples/burgers_eq.md
      - Lid-driven cavity flow: examples/cavity_flow_steady.md
      - Flow around a cylinder: examples/cylinder_flow_steady.md
      - Backward-facing step: examples/BFS_flow_steady.md
    - Transient problems:
      - Transient channel flow: examples/channel_flow_transient.md
      - 2D heat equation: examples/heat_eq.md
  - API reference: reference/index.md
  - Project:
    - Contributing: project/contributing.md
    - Changelog: project/changelog.md
    - Cite: project/cite.md
