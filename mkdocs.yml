site_name: DeepFlow   # Change to your project name
site_url: https://yoyo-xyz.github.io/pinn-deepflow/
repo_url: https://github.com/YoYo-XYZ/pinn-deepflow
repo_name: GitHub
edit_uri: edit/dev/docs/    # Lets people click "Edit on GitHub"

theme:
  name: material             # The beautiful theme
  features:
    - content.code.copy      # Copy button on code blocks
    - content.action.edit    # Edit this page on GitHub
    - navigation.tabs        # Top tabs if you want
    - navigation.sections
    - search.suggest
    - search.highlight
    
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            filters:
              - "!^_"
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:     # Math support: $$ equation $$
      generic: true
  - admonition               # Callouts: !!! note "Title"
  - attr_list
  - md_in_html

nav:                           # Your menu structure – edit as you add pages
  - Home: index.md
  - Quick Start: quickstart.md
  - Installation: install.md
  - Examples:
    - Overview: examples.md
    - Steady problems:
      - Burgers' Equation: burgers_eq.md
      - Lid-driven Cavity Flow: cavity_flow_steady.md
      - Flow around a Cylinder: cylinder_flow_steady.md
      - Backward-facing Step: BFS_flow_steady.md
    - Transient problems:
      - Transient Channel Flow: channel_flow_transient.md
      - 2D Heat Equation: heat_eq.md
  - API: reference.md
  - FAQ: faq.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Cite: cite.md
